# TEMPLATE — copied to ~/.config/mmr/ on first run (container.ensure_config_dir,
# start_mmr.sh, docker-entrypoint.sh). Edits here do NOT affect a running
# system. The live config lives in ~/.config/mmr/ (bind-mounted into the
# container at /home/trader/.config/mmr/). Use this file to update defaults
# that ship with the repo for fresh installs only.
# fires up all the services minus the docker based ones (X, vnc etc)
root_directory: .
port: 8081
env: TRADER_CHECK=False
health_check_eval:
  - "exec('from trader.tools.trader_check import health_check') or health_check('~/.config/mmr/trader.yaml')"
jobs:
    # NOTE (G0 Task 5): data_service / trader_service / strategy_service are
    # no longer declared here -- each is its own supervised process (Compose
    # services in Docker mode; plain child processes launched directly by
    # start_mmr.sh in hybrid/non-Docker mode). This file (and pycron.yaml)
    # now owns ONLY the one-shot cron jobs below. See
    # tests/test_compose_topology.py for the enforced invariant.
    # ---- declarative data refreshes (driven by data_refresh.yaml) ----
    # See pycron.yaml for the full explanation.
    - name: data_refresh_us
      description: refresh US universes (TwelveData) — after US after-hours close
      command: python3
      arguments: -m trader.mmr_cli data refresh us_top20_daily us_top20_1min
      start: "30 20 * * 1-5"     # 8:30 PM ET (30 min after AH close at 20:00)
      start_on_pycron_start: False
      restart_if_found: False
      restart_if_finished: False
    - name: data_refresh_asx
      description: refresh ASX universes (IB) — after ASX close (no AH session)
      command: python3
      arguments: -m trader.mmr_cli data refresh asx_daily asx_1min
      start: "30 16 * * 0-4"     # 4:30 PM ET Sun-Thu = 16:30 AEST Mon-Fri
      start_on_pycron_start: False
      restart_if_found: False
      restart_if_finished: False
    - name: db_backup
      description: clean DuckDB snapshot to the backups/ dir (keeps newest 7)
      command: python3
      arguments: -m trader.mmr_cli data backup --keep 7
      start: "17 22 * * *"       # 10:17 PM daily, after the data-refresh jobs
      start_on_pycron_start: False
      restart_if_found: False
      restart_if_finished: False
