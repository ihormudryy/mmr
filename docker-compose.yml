name: mmr

# G0 Task 5: one supervisor per long-lived process.
#
# Previously a single `mmr` container ran data_service/trader_service/
# strategy_service/web_dashboard as plain child processes of start_mmr.sh
# (PID 1), with pycron's job list for those same four processes never
# actually invoked by anything (dead config -- start_mmr.sh never execs
# pycron.pycron). Restarting or debugging one process meant restarting (or
# exec-ing into) all of them, and a single OOM/crash could take the whole
# stack down together.
#
# Now each long-lived process is its OWN Compose service, all built from the
# SAME image (one `build:` block, reused via the `mmr-build` anchor) with a
# per-service `command:`. `scheduler` is the one place pycron now actually
# runs, and it owns ONLY the one-shot cron jobs (data refresh, backup) --
# see config_defaults/pycron.yaml.
#
# Hardening applied uniformly: non-root `user: trader`, `read_only: true`
# root filesystem (writable paths are explicit volumes/tmpfs only -- see the
# per-service comments below), a healthcheck, explicit memory/CPU limits,
# and the private `mmr-internal` network. Nothing here is published to the
# host except: dashboard's HTTP port, and the typed query (42101) + command
# (42102) ports on `trader` -- all three on host 127.0.0.1 only. The typed
# feed port (42103) and every legacy ZMQ port (42001/42002/42003/42005/42006)
# stay on the private network and are never host-published, per the G0 plan's
# global constraints.
#
# Cross-container addressing: several services connect OUT to a sibling
# rather than just binding their own socket (confirmed by reading the
# construction sites, not assumed): strategy_service subscribes to trader's
# ticker PubSub and MessageBus, and opens an RPC client to trader's legacy
# RPC port for resolve_symbol()/the signal->proposal bridge
# (trader/strategy/strategy_runtime.py); trader_service opens an RPC client
# to strategy_service's own RPC port (trader/trading/trading_runtime.py).
# Each service's ZMQ_*_SERVER_ADDRESS below is therefore set to `tcp://0.0.0.0`
# when that var configures THAT service's own bind, and to the peer
# container's Compose DNS name (`tcp://trader` / `tcp://strategy`) when it
# configures an outbound connection -- the same env var name serves both
# roles depending on which process reads it, and each container gets its own
# independent value.
#
# KNOWN GAP (pre-existing, not introduced or fixable here -- see the G0
# Task 5 report): trader_service's legacy RPCServer (port 42001) is only
# constructed in offline simulation with `unsafe_legacy_rpc: true` (G0
# Task 4). In a real production posture neither flag is set, so
# strategy_service's `trader_client` (resolve_symbol calls, the
# auto_execute:propose signal bridge) will get ConnectionError/timeout
# against a live trader_service until [M1-F3] adds typed command/query
# equivalents. This is an extension of Task 4's own flagged concern #1, not
# a regression from this task.

x-mmr-build: &mmr-build
  context: .
  dockerfile: Dockerfile
  # Pinned explicitly (G0 Task 6) now that the Dockerfile has a second,
  # test-only stage (`test`, layered FROM this one) -- without an explicit
  # target, Docker defaults to the LAST stage in the file, which would
  # silently ship pytest/docker-py in every one of these five production
  # services. Only `fullstack-tests` (below) overrides this to `test`.
  target: runtime

x-mmr-common-env: &mmr-common-env
  TRADER_CONFIG: /home/trader/.config/mmr/trader.yaml
  TZ: ${TIME_ZONE:-America/New_York}
  TRADING_MODE: ${TRADING_MODE:-paper}
  IB_SERVER_ADDRESS: ib-gateway
  IB_ACCOUNT: ${IB_ACCOUNT:-}
  # ~/dev/news scraper service runs on the HOST (separate stack); only
  # consumed by the `mmr` CLI (news/ideas --news), not by any of these
  # long-lived services, but kept available for anyone `docker compose exec`
  # -ing in to run CLI commands.
  NEWS_SERVICE_URL: ${NEWS_SERVICE_URL:-http://host.docker.internal:8089}
  MASSIVE_API_KEY: ${MASSIVE_API_KEY:-}
  TWELVEDATA_API_KEY: ${TWELVEDATA_API_KEY:-}
  # Skip writing .pyc under the read-only, editable-installed source tree
  # (harmless if it happens -- CPython swallows bytecode-cache write
  # failures -- but this avoids relying on that silently-swallowed path).
  PYTHONDONTWRITEBYTECODE: "1"
  # NOTE (G0 Task 6): MMR_FAKE_BROKER is DELIBERATELY NOT here. The stub
  # broker is a test-only mechanism that must NEVER be reachable by the
  # production `trader` service -- putting it on this shared anchor once
  # leaked it into `trader`'s production environment (a live `docker compose
  # up` with the var exported would have fabricated a broker on a live
  # account). It is injected into `trader` ONLY for the test profile, via
  # docker-compose.test.override.yml (an explicitly-passed `-f` override,
  # never auto-loaded), together with the `--simulation` flag the
  # fail-loud guard in trading_runtime.py's _fake_broker_enabled() requires.

x-mmr-hardening: &mmr-hardening
  # One shared image tag across all five services: `docker compose build`
  # builds it exactly once (identical build context/Dockerfile + identical
  # tag), and every service's own `command:` (below) selects which process
  # that same image runs -- this is the literal "one built image" the brief
  # asks for, not just five images that happen to be built the same way.
  image: mmr:latest
  restart: unless-stopped
  user: trader
  read_only: true
  # /home/trader/.tmp and /home/trader/.cache are where TMPDIR and numba's/
  # pip's caches point (see Dockerfile ENV TMPDIR=$HOME/.tmp) -- tmpfs all
  # three so nothing under the read-only root needs a write and silently
  # (or loudly) fails.
  tmpfs:
    - /tmp
    - /home/trader/.tmp
    - /home/trader/.cache
  networks:
    - mmr-internal

services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:latest
    # unless-stopped so IB Gateway comes back after a host reboot / Docker
    # restart (the mmr services depend on it). OOM kills still surface on
    # the last-exit state (RestartCount / OOMKilled=true); availability
    # wins for an always-on trading stack. (Was `on-failure` to keep the
    # OOM signal visible.)
    restart: unless-stopped
    networks:
      - mmr-internal
    # IB Gateway itself (Java + XVfb + VNC) sits around 600–800 MB steady
    # state. Capping at 1.5G gives headroom for the JVM to GC without
    # letting it run away and starve the rest of the VM.
    mem_limit: 2g
    memswap_limit: 2g
    env_file: .env
    environment:
      TWS_USERID: ${TWS_USERID}
      TWS_PASSWORD: ${TWS_PASSWORD}
      TRADING_MODE: ${TRADING_MODE:-paper}
      TWS_ACCEPT_INCOMING: ${TWS_ACCEPT_INCOMING:-accept}
      READ_ONLY_API: ${READ_ONLY_API:-no}
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:-trader}
      TWOFA_TIMEOUT_ACTION: ${TWOFA_TIMEOUT_ACTION:-restart}
      RELOGIN_AFTER_TWOFA_TIMEOUT: ${RELOGIN_AFTER_TWOFA_TIMEOUT:-yes}
      EXISTING_SESSION_DETECTED_ACTION: ${EXISTING_SESSION_DETECTED_ACTION:-primary}
      AUTO_RESTART_TIME: "${AUTO_RESTART_TIME:-11:59 PM}"
      ALLOW_BLIND_TRADING: ${ALLOW_BLIND_TRADING:-no}
      BYPASS_WARNING: ${BYPASS_WARNING:-yes}
      SAVE_TWS_SETTINGS: ${SAVE_TWS_SETTINGS:-"08:00 17:00"}
      TIME_ZONE: ${TIME_ZONE:-America/New_York}
      TZ: ${TIME_ZONE:-America/New_York}
      # Persist settings to a separate path so /home/ibgateway/Jts templates stay intact
      TWS_SETTINGS_PATH: /home/ibgateway/tws_settings
      # Override default 1024x768 — patched run.sh reads XVFB_SCREEN env var
      XVFB_SCREEN: ${XVFB_SCREEN:-1920x1080x24}
    volumes:
      - ./scripts/ib-gateway-run.sh:/home/ibgateway/scripts/run.sh:ro
      # Persist TWS runtime settings (auto-restart state, login sessions) across restarts
      - ${HOME}/.local/share/mmr/tws_settings:/home/ibgateway/tws_settings
    ports:
      # IB Gateway API ports mapped to standard TWS ports (live: 7496, paper: 7497)
      - "127.0.0.1:7496:4003"
      - "127.0.0.1:7497:4004"
      # VNC for viewing IB Gateway GUI
      - "127.0.0.1:5901:5900"

  # ── data: historical data downloader (trader/data_service.py) ──────────
  # Writes OHLCV bars to history_duckdb_path -- needs the DB volume despite
  # the brief naming `trader` as the primary owner (confirmed by reading
  # DataService.__init__ / its TickStorage/DuckDBDataStore construction).
  data:
    <<: *mmr-hardening
    build: *mmr-build
    command: ["python", "-m", "trader.data_service"]
    depends_on:
      - ib-gateway
    mem_limit: 2g
    cpus: 1.0
    environment:
      <<: *mmr-common-env
      ZMQ_DATA_RPC_SERVER_ADDRESS: tcp://0.0.0.0
    volumes:
      - ${HOME}/.config/mmr:/home/trader/.config/mmr
      - mmr_db_data:/home/trader/.local/share/mmr/data
      - ${HOME}/.local/share/mmr/logs:/home/trader/.local/share/mmr/logs
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 42003), timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── trader: IB trading runtime (trader/trader_service.py) ───────────────
  # Owns duckdb_path (events/proposals/groups/universes) -- the database
  # volume the brief calls out explicitly. Also the ONLY service that
  # publishes anything besides dashboard: the typed query/command ports,
  # loopback-only. The typed feed port (42103) is bound but never published.
  trader:
    <<: *mmr-hardening
    build: *mmr-build
    command: ["python", "-m", "trader.trader_service"]
    depends_on:
      - ib-gateway
    mem_limit: 4g
    cpus: 2.0
    environment:
      <<: *mmr-common-env
      # This service's own socket binds -- 0.0.0.0 so sibling containers on
      # mmr-internal can reach them by the "trader" DNS name.
      ZMQ_RPC_SERVER_ADDRESS: tcp://0.0.0.0
      ZMQ_PUBSUB_SERVER_ADDRESS: tcp://0.0.0.0
      ZMQ_MESSAGEBUS_SERVER_ADDRESS: tcp://0.0.0.0
      # The typed query/command/feed ROUTER sockets bind here. Must be
      # 0.0.0.0, NOT the loopback default -- otherwise they'd bind the
      # container's loopback only, and Docker's `127.0.0.1:42101:42101`
      # host-forward (which lands on the container's eth0) plus any
      # cross-container `trader:4210x` connection would both be refused.
      # Threaded into TypedRpcServer(address=...) via
      # trading_runtime.py's typed_bind_address (G0 Task 5 fix). Feed
      # (42103) binds 0.0.0.0 too but is never host-published (see ports).
      TYPED_BIND_ADDRESS: tcp://0.0.0.0
      # Outbound: trader opens an RPCClient to strategy_service's own RPC
      # server (trading_runtime.py's self.zmq_strategy_client) -- must
      # target the strategy container by name, not 0.0.0.0.
      ZMQ_STRATEGY_RPC_SERVER_ADDRESS: tcp://strategy
    ports:
      - "127.0.0.1:42101:42101"   # typed query
      - "127.0.0.1:42102:42102"   # typed command
      # typed feed (42103) intentionally NOT published -- private network only
    volumes:
      - ${HOME}/.config/mmr:/home/trader/.config/mmr
      - mmr_db_data:/home/trader/.local/share/mmr/data
      - ${HOME}/.local/share/mmr/logs:/home/trader/.local/share/mmr/logs
      # P3 Task 9: read-only signed artifact bundles for paper automation.
      # Defaults stay disabled in trader.yaml; mount is always present so a
      # paper enable does not require a compose edit. Live mode additionally
      # refuses writable mounts inside ArtifactVerifier.
      - ${HOME}/.local/share/mmr/artifacts:/home/trader/.local/share/mmr/artifacts:ro
    healthcheck:
      # LIVENESS ONLY. Semantic trading readiness is exposed by typed
      # get_status and gates automation; it must not restart-loop a healthy,
      # diagnosable trader merely because the market is closed or the breaker
      # is tripped.
      # Connect via the container's OWN routable hostname (eth0), not
      # 127.0.0.1: because TYPED_BIND_ADDRESS is 0.0.0.0 the socket accepts
      # on every interface, so a hostname-resolved connect proves the
      # published/cross-container surface actually works -- a 127.0.0.1
      # probe would report healthy even under the loopback-only bind bug
      # this task fixed (it can't distinguish 0.0.0.0 from 127.0.0.1 binds).
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection((socket.gethostname(), 42101), timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── strategy: strategy runtime (trader/strategy_service.py) ─────────────
  # "the strategy-config volume" from the brief is ~/.config/mmr (single
  # source of truth for strategy_runtime.yaml -- the CLI's `strategies
  # deploy` and the dashboard's deploy-from-disk route both write there, and
  # this service's 30s reconciliation loop re-reads it). It ALSO opens
  # EventStore/ProposalStore/UniverseAccessor/TickStorage directly against
  # duckdb_path/history_duckdb_path (confirmed in strategy_runtime.py), so
  # it needs the DB volume too, not just config.
  strategy:
    <<: *mmr-hardening
    build: *mmr-build
    # strategies_directory in trader.yaml is the relative path `strategies`,
    # resolved against CWD. The image's default WORKDIR is /home/trader, so
    # without this the service looks for /home/trader/strategies (missing) and
    # every strategy fails to load. The source tree (and strategies/) lives at
    # /home/trader/mmr -- same repo-root CWD the scheduler already pins.
    working_dir: /home/trader/mmr
    command: ["python", "-m", "trader.strategy_service"]
    depends_on:
      - ib-gateway
      - trader
    mem_limit: 2g
    cpus: 1.0
    environment:
      <<: *mmr-common-env
      # Typed query/command sockets (42104/42105) must bind 0.0.0.0 so sibling
      # containers (dashboard deploy tab, trader coordinator) can reach them
      # via the "strategy" DNS name — same fix as the trader service's
      # TYPED_BIND_ADDRESS (loopback-only binds refuse cross-container TCP).
      TYPED_BIND_ADDRESS: tcp://0.0.0.0
      # This service's own RPC server bind.
      ZMQ_STRATEGY_RPC_SERVER_ADDRESS: tcp://0.0.0.0
      # Outbound: subscribes to trader's ticker PubSub and MessageBus, and
      # opens an RPC client to trader's legacy RPC port (resolve_symbol /
      # the signal->proposal bridge -- see the top-of-file KNOWN GAP note).
      ZMQ_PUBSUB_SERVER_ADDRESS: tcp://trader
      ZMQ_MESSAGEBUS_SERVER_ADDRESS: tcp://trader
      ZMQ_RPC_SERVER_ADDRESS: tcp://trader
      # Outbound: the trader's typed command/query sockets (42102/42101) --
      # carries record_state_acknowledged state announcements (what populates
      # the command center's Strategies panel) and the SignalProposer bridge.
      # Without this the runtime falls back to TYPED_BIND_ADDRESS
      # (tcp://0.0.0.0 here -- its OWN bind), i.e. the wrong host.
      TRADER_TYPED_ADDRESS: tcp://trader
    volumes:
      - ${HOME}/.config/mmr:/home/trader/.config/mmr
      - mmr_db_data:/home/trader/.local/share/mmr/data
      - ${HOME}/.local/share/mmr/logs:/home/trader/.local/share/mmr/logs
      # P3 Task 9: same read-only artifact tree the trader verifies again at
      # command time (strategy load verifies once; trader never trusts a
      # strategy-service "verified" boolean).
      - ${HOME}/.local/share/mmr/artifacts:/home/trader/.local/share/mmr/artifacts:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 42105), timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── dashboard: read-only web UI (web/app.py) ─────────────────────────────
  # Deliberately NO database volume -- must reach trading data only via RPC
  # to trader_service, never the DB file directly (see the KNOWN GAP note
  # below and in the Task 5 report: two existing dashboard features --
  # the Proposals list and the Watchlists tab -- currently open duckdb_path
  # directly via the SDK/UniverseAccessor and WILL show error banners under
  # this constraint until a follow-up adds RPC-backed equivalents; every
  # other section degrades independently per the dashboard's existing
  # per-section try/except design, so this is a bounded, visible failure,
  # not a silent one).
  #
  # RPC ADDRESSING + PRODUCTION LIMITATION (G0 Task 5 fix + known sequencing
  # gap): the dashboard's SDK opens a LEGACY dill/msgpack RPCClient to
  # trader_service (sdk.py). ZMQ_RPC_SERVER_ADDRESS below points it at the
  # `trader` container over the private network (the SDK now honours this env
  # var -- previously it read only the shared trader.yaml's loopback and so
  # targeted its own empty loopback). BUT that legacy RPC server is bound by
  # trader_service ONLY in offline simulation with unsafe_legacy_rpc=true (G0
  # Task 4). Against a PRODUCTION-mode trader (the default `command:` above,
  # no --simulation) the legacy server is never bound, and the SDK is not yet
  # on the typed transport, so the dashboard is KNOWINGLY NON-FUNCTIONAL until
  # [M1-F3] migrates the SDK to the authenticated typed query/command sockets.
  # This is by-design release sequencing (finish G0 before trusting the
  # command surface), NOT a defect to fix here. In offline-sim / the Task 6
  # fullstack profile (MMR_FAKE_BROKER) the addressing above makes it work.
  #
  # Gets ~/.config/mmr read-write (needed to boot with the real trader.yaml,
  # and its "deploy strategy from disk" route writes strategy_runtime.yaml)
  # and a dedicated logs mount -- NOT the broader ~/.local/share/mmr tree,
  # so a stray write to the (otherwise DB-volume-backed) data/ subdirectory
  # can't silently create a divergent, empty duckdb file; read_only:true
  # plus no volume there means any such attempt fails loudly instead.
  dashboard:
    <<: *mmr-hardening
    build: *mmr-build
    command: ["python", "-m", "web.app"]
    depends_on:
      - trader
      - strategy
    mem_limit: 1g
    cpus: 0.5
    environment:
      <<: *mmr-common-env
      WEB_PORT: "7424"
      # The dashboard is a pure read client -- it must NEVER execute a dill
      # payload, so command-center startup asserts strict mode. Without this
      # the command center degrades to inert at boot (ops probes stay up, but
      # /session 500s and no live data flows). Scoped to the dashboard only --
      # the trader/strategy services legitimately use dill for object_store
      # blobs + EXT_OBJECT, so this must NOT go on the shared env anchor.
      MMR_DILL_STRICT: "1"
      # Session auth: login token + >=32-byte HMAC session secret, sourced from
      # .env (gitignored). The command center raises CredentialConfigError ->
      # POST /session 500 without both. Read-only dashboard: commands stay
      # disabled (DASHBOARD_COMMANDS_ENABLED unset -> false).
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:-}
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:-}
      # Shared service HMAC key for the typed-RPC seam to the trader (the read
      # bridge + command gateway authenticate with it). Same 0600 key the trader
      # loads via trader.yaml's service_hmac_key_file; it's already on the
      # ~/.config/mmr mount below. Without it the command center degrades at boot
      # with ServiceHmacKeyError. (The read path additionally needs the trader's
      # from-wire snapshot/event decoders -- integration-gate CRITICAL-1 -- before
      # live data flows; this env only clears the credential prerequisite.)
      MMR_SERVICE_HMAC_KEY_FILE: /home/trader/.config/mmr/service_hmac.key
      # Outbound RPC/PubSub to the trader container (see the addressing note
      # above). No 0.0.0.0 binds here -- the dashboard is a pure client.
      ZMQ_RPC_SERVER_ADDRESS: tcp://trader
      ZMQ_PUBSUB_SERVER_ADDRESS: tcp://trader
      # Command-center typed-RPC seam to the trader. CommandCenterConfig
      # defaults these to 127.0.0.1 (fine on a single host), but in the
      # split-container model the trader is a SEPARATE service. Without them
      # the read bridge's query/feed clients dial the dashboard's OWN
      # localhost, the snapshot_with_cursor request never gets a reply, and the
      # bridge hangs in SYNCHRONIZING forever -> /api/snapshot 503. The trader
      # binds all of these on 0.0.0.0: 42101 query, 42103 feed, 42102 command;
      # pub/sub (quote plane) is MMR_PUBSUB_ADDRESS + MMR_PUBSUB_PORT (42002).
      MMR_TYPED_QUERY_ENDPOINT: tcp://trader:42101
      MMR_TYPED_FEED_ENDPOINT: tcp://trader:42103
      MMR_TYPED_COMMAND_ENDPOINT: tcp://trader:42102
      MMR_TYPED_STRATEGY_QUERY_ENDPOINT: tcp://strategy:42105
      MMR_TYPED_STRATEGY_COMMAND_ENDPOINT: tcp://strategy:42104
      MMR_PUBSUB_ADDRESS: tcp://trader
    ports:
      - "127.0.0.1:7424:7424"
    volumes:
      - ${HOME}/.config/mmr:/home/trader/.config/mmr
      - ${HOME}/.local/share/mmr/logs:/home/trader/.local/share/mmr/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:7424/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── scheduler: pycron, one-shot cron jobs only ───────────────────────────
  # No long-lived trading process here anymore -- just data-refresh/backup
  # cron entries (config_defaults/pycron.yaml). Needs the DB volume
  # read-write (data-refresh jobs write history bars; the backup job reads
  # both duckdb files) plus the host-mounted backups/ dir (db_backup's
  # destination, separate from the volume-backed data/) and ~/.config/mmr
  # (pycron.yaml itself, data_refresh.yaml, trader.yaml).
  scheduler:
    <<: *mmr-hardening
    build: *mmr-build
    # `pycron` is a plain top-level script directory, not part of the
    # installed `mmr` distribution (pyproject.toml's packages.find only
    # includes trader*/web*) -- it has no __init__.py and was historically
    # invoked as `python3 pycron/pycron.py` from the repo root, never as
    # `python -m pycron.pycron`. That exact module form (required by this
    # task's brief) only resolves via Python's implicit namespace-package
    # lookup, which needs the repo root on sys.path -- `-m` prepends the
    # CWD, so working_dir must be the repo root (confirmed empirically:
    # `python -m pycron.pycron --help` fails with ModuleNotFoundError from
    # the image's default WORKDIR /home/trader, succeeds from
    # /home/trader/mmr).
    working_dir: /home/trader/mmr
    command: ["python", "-m", "pycron.pycron", "--config", "/home/trader/.config/mmr/pycron.yaml"]
    depends_on:
      - ib-gateway
    mem_limit: 2g
    cpus: 1.0
    environment:
      <<: *mmr-common-env
    volumes:
      - ${HOME}/.config/mmr:/home/trader/.config/mmr
      - mmr_db_data:/home/trader/.local/share/mmr/data
      - ${HOME}/.local/share/mmr/backups:/home/trader/.local/share/mmr/backups
      - ${HOME}/.local/share/mmr/logs:/home/trader/.local/share/mmr/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── fullstack-tests: process-supervision gate (G0 Task 6, test profile) ──
  # NOT part of the production topology -- profiles:["test"] means a plain
  # `docker compose up` never creates this service. It is brought up with:
  #   docker compose -f docker-compose.yml -f docker-compose.test.override.yml \
  #     --profile test up --build --abort-on-container-exit fullstack-tests
  # Brings up the full five-service + ib-gateway graph (via depends_on) and
  # runs tests/fullstack/test_process_supervision.py against the REAL
  # containers over docker.sock, proving Task 5's one-supervisor-per-process
  # claim empirically (kill one, siblings' container IDs/restart counts are
  # unaffected; the killed one's OWN healthcheck degrades then recovers once
  # Compose restarts it).
  #
  # The `MMR_FAKE_BROKER: "1"` below is read ONLY by this test-runner
  # container's own code path (the test's skip-guard) -- it is NOT what makes
  # `trader` fake its broker. The `trader` service must NOT carry
  # MMR_FAKE_BROKER in this base file (that once leaked the stub into
  # production `trader`); the flag AND the `--simulation` command the
  # fail-loud guard in trading_runtime.py requires are injected into `trader`
  # ONLY via docker-compose.test.override.yml (explicitly passed with `-f`,
  # never auto-loaded). `data`/`strategy`/`scheduler` never touch IB at boot
  # regardless (confirmed by reading their startup paths).
  #
  # `build.target: test` selects the Dockerfile's test-only stage (pytest +
  # docker-py layered on top of the same `runtime` image the other five
  # services use) -- see the Dockerfile and the `x-mmr-build` anchor above.
  # The read-only Docker socket mount lets the supervision test stop/kill
  # and inspect sibling containers; it exists ONLY in this test-profile
  # service, never in production.
  fullstack-tests:
    profiles: ["test"]
    build:
      <<: *mmr-build
      target: test
    # Deliberately root, NOT `user: trader` -- confirmed empirically: the
    # bind-mounted host docker.sock is a root-owned, group-0-permissioned
    # socket (mode 0660) on every Docker install checked (Docker Desktop's
    # Linux VM here; native Linux hosts commonly use a *different*, host-
    # specific `docker` group GID instead of 0). Chasing that GID portably
    # from a static `group_add:` isn't possible across hosts/CI runners, and
    # this container never runs in production (`profiles: ["test"]`) or
    # touches trading logic -- its entire job is privileged Docker
    # introspection (stop/kill/inspect siblings), so root here is the
    # correct, portable, narrowly-scoped exception to this file's otherwise
    # uniform non-root hardening.
    user: root
    # `tests/fullstack` is a relative path -- resolves against CWD, and the
    # image's default WORKDIR (post-ENTRYPOINT) is /home/trader, one level
    # above the repo checkout. Same gotcha Task 5 hit for `scheduler`'s
    # `python -m pycron.pycron` (see that service's comment above) --
    # confirmed empirically here too (pytest reports "file or directory
    # not found: tests/fullstack" without this).
    working_dir: /home/trader/mmr
    command: ["python", "-m", "pytest", "tests/fullstack", "-q", "--timeout=300"]
    environment:
      TRADING_MODE: paper
      MMR_FAKE_BROKER: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [mmr-internal]
    depends_on: [data, trader, strategy, dashboard, scheduler]

networks:
  mmr-internal:
    # A private, user-defined bridge network -- NOT Compose's `internal:
    # true` flag, which would cut off ALL outbound internet access for
    # every container on it (breaking data_service's Massive/TwelveData
    # downloads, the scheduler's data-refresh jobs, and IB Gateway's own
    # upstream connection). "Private" here means "not published to the
    # host except the three explicit loopback port mappings above" -- the
    # actual host-exposure control is each service's own `ports:` list.

volumes:
  mmr_db_data:
