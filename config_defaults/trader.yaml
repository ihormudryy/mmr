# TEMPLATE — copied to ~/.config/mmr/ on first run (container.ensure_config_dir,
# start_mmr.sh, docker-entrypoint.sh). Edits here do NOT affect a running
# system. The live config lives in ~/.config/mmr/ (bind-mounted into the
# container at /home/trader/.config/mmr/). Use this file to update defaults
# that ship with the repo for fresh installs only.
# MMR Configuration
# User configs live in ~/.config/mmr/ (copied from bundled configs on first run)
# Environment variables override these values (uppercase param name)

root_directory: .
config_file: ~/.config/mmr/trader.yaml
pycron_config_file: ~/.config/mmr/pycron.yaml
strategy_config_file: ~/.config/mmr/strategy_runtime.yaml
logfile: ~/.local/share/mmr/logs/trader.log
strategies_directory: strategies
strategy_signal_record_retention_days: 7  # durable signal record for the ai controller (SP2)

# Trading mode: 'paper' or 'live'
# This selects which account and port are used.
trading_mode: paper

# Hard gate: when true, trader_service refuses direct buy/sell RPCs
# (mmr buy / mmr sell / MMRHelpers.sell/buy / cli("buy ...")). Every
# actionable new trade must go through propose → approve. Liquidation
# paths (close-all, resize-positions) bypass via skip_risk_gate=True.
# Strongly recommended for live trading with any autonomous agent in
# the loop. Off by default so paper / manual workflows aren't disturbed.
require_proposal_approval: false

# Interactive Brokers connection
# Set both accounts — trading_mode picks the active one.
# IB_ACCOUNT env var overrides the auto-selected account.
# IB_SERVER_PORT env var overrides the auto-selected port.
ib_server_address: 127.0.0.1
ib_paper_account: ''
ib_live_account: ''
ib_paper_port: 7497
ib_live_port: 7496
trading_runtime_ib_client_id: 5
strategy_runtime_ib_client_id: 7

# DuckDB storage
# All persistent data lives in ~/.local/share/mmr/ (same location for Docker and local)
# duckdb_path: trading data (events, proposals, groups, universes)
# history_duckdb_path: OHLCV bars (separate file avoids lock contention with trading services)
# journal_duckdb_path: domain event journal, snapshot checkpoints, and materialized-state
#   tables ([M1-F1]) -- dedicated file, owned exclusively by trader_service. A persistent
#   connection on the shared duckdb_path file would lock out CLI access cross-process.
duckdb_path: ~/.local/share/mmr/data/mmr.duckdb
history_duckdb_path: ~/.local/share/mmr/data/mmr_history.duckdb
journal_duckdb_path: ~/.local/share/mmr/data/mmr_journal.duckdb
# research_duckdb_path: offline research evidence store (P2). Owned by the
# offline research CLI/process ONLY -- trader_service and strategy_service never
# open it. Must resolve to a distinct file from the paths above (startup fails
# closed otherwise). Override per-shell with RESEARCH_DUCKDB_PATH.
research_duckdb_path: ~/.local/share/mmr/data/mmr_research.duckdb
universe_library: 'Universes'

# Pycron process manager
pycron_server_address: 127.0.0.1
pycron_server_port: 8081

# ZeroMQ messaging
zmq_rpc_server_address: tcp://127.0.0.1
zmq_rpc_server_port: 42001
zmq_pubsub_server_address: tcp://127.0.0.1
zmq_pubsub_server_port: 42002
zmq_strategy_rpc_server_address: tcp://127.0.0.1
zmq_strategy_rpc_server_port: 42005
zmq_messagebus_server_address: tcp://127.0.0.1
zmq_messagebus_server_port: 42006
zmq_data_rpc_server_address: tcp://127.0.0.1
zmq_data_rpc_server_port: 42003

# Typed, authenticated query/command/feed transport (G0 runtime & RPC
# security). Ports are frozen by the command-center plan index. These
# sockets bind on the private Compose network only -- a later Compose task
# enforces that they are never host-published (except query/command on
# host 127.0.0.1, per the plan's loopback-only allowance; feed never is).
# Authentication: one Ed25519 key per principal in ~/.config/mmr/keys/rpc/
# (<principal>.key mode 0600, <principal>.pub), created by `mmr keys init`
# (Docker: ./docker.sh -k). There is no key setting in this file; the
# old shared HMAC key is retired.
# typed_bind_address: the interface the query/command/feed ROUTER sockets
# BIND to (distinct from host-publishing, which is a Compose concern).
# Loopback by default -- safe for local/non-Docker. The Compose `trader`
# service overrides this to tcp://0.0.0.0 (via TYPED_BIND_ADDRESS) so the
# loopback host-publish of 42101/42102 and cross-container peers on the
# private network can actually reach the sockets.
typed_bind_address: tcp://127.0.0.1
typed_query_port: 42101
typed_command_port: 42102
typed_feed_port: 42103

# [M1-F3] Task 7: strategy_service's own typed query/command sockets --
# the receiving end of the coordinator's one-way strategy-control forwarding
# (enable_strategy/disable_strategy/update_strategy_params). The bind address
# is shared with the trader's own typed sockets above; only the ports differ.
# The strategy service signs as its own principal (keys/rpc/strategy.key).
strategy_typed_command_port: 42104
strategy_typed_query_port: 42105

# Hard gate: the legacy dill/msgpack RPC path (raw Python objects, no
# per-method allowlist) may only run when simulation=True AND this is also
# explicitly true -- production always uses the typed query/command/feed
# transport above. Also needs trading_mode: paper, a paper (D-prefixed)
# account and the IB paper port, all agreeing. Refused at startup otherwise (G0 Task 4). Gates both the
# trader's 42001 and the strategy service's 42005.
unsafe_legacy_rpc: false

# Command-authority policy (trader-owned; design C2 in
# docs/superpowers/specs/2026-07-18-command-plane-activation-design.md). The
# dashboard's DASHBOARD_COMMANDS_ENABLED flag is only a UI kill switch --
# risk-increasing commands (approve / create / cancel / strategy-control) are
# gated by THIS policy, validated fail-closed at startup (a live authority
# without a matching account or a notional ceiling refuses to start). Disabled
# by default: the trader stays read-only + strategy-state-ack until the
# command-plane integration gate is complete.
#
# ACTIVATION (paper only): before setting enabled: true, pass BOTH halves of the
# release gate -- the synthetic drills (scripts/command_plane_drill.py, exit 0)
# AND a recorded IB-paper session soak (scripts/run_paper_soak.py during market
# hours). Full runbook + prerequisites:
#   docs/superpowers/rollout/trading-income-operations-runbook.md
# Enable per-deployment in ~/.config/mmr/trader.yaml or env -- never here.
command_authority:
  enabled: true            # master switch: build/register the authority at all
  live_enabled: false      # allow risk-increasing commands on a LIVE account
  live_account_id: ''      # must equal the trader's IB account when live_enabled
  # Hard per-order notional ceiling, enforced in BOTH paper and live (required
  # when live_enabled). Without it a fresh LLM/auto entry has no hard per-trade
  # size cap — the risk gate's concentration limit only bounds ADDING to an
  # existing position, not opening one. 25000 matches the position_sizing.yaml
  # per-position ceiling ($25k). Raise per-deployment in ~/.config/mmr if your
  # book legitimately needs larger single orders.
  max_order_notional: 25000
  max_drift_bps: 50        # server-side price-drift ceiling (bps)
  # Opt-in PAPER quote-staleness bound (seconds). Live mode always enforces a
  # hard 5s age; paper otherwise checks only price-drift, so a market-closed /
  # degraded-feed snapshot serving a cached last-value could pass. 1800 (30 min)
  # is deliberately generous: paper commonly runs on ~15-min delayed data whose
  # timestamp is legitimately old, so a tight bound would reject every delayed
  # quote. This rejects hours-old cached values, not normal delayed data. Blank
  # = off (legacy behaviour). Only relevant with automation / LLM auto-approve.
  max_paper_quote_age_seconds: 1800

# Deterministic automation configuration (P3).
# When enabled, only a single signed artifact bundle runs under strict control.
# All defaults are false/empty — enable per-deployment via ~/.config/mmr/trader.yaml.
# live_enabled remains false until P4; paper vertical slice only.
automation:
  enabled: false
  live_enabled: false
  artifact_bundle_path: ''
  public_key_ring_path: ''
  expected_artifact_id: ''
  strategy_name: ''
  # Paper only. When IB has no live quote (for example only delayed data, IB
  # error 354), use Alpaca's free real-time IEX quote, labelled iex_realtime.
  # Needs ALPACA_API_KEY_ID / ALPACA_API_SECRET_KEY. Empty = off. A live
  # account ignores it. Any other value stops the trader at startup.
  # quote_fallback: alpaca_iex

# AI paper experiment (SP1). Owner-only: no AI principal can change this block.
# limits_ceiling caps every AI risk policy. Empty = today's paper limits. Only
# gross_fraction may rise above them (up to 0.15); every value is a fraction.
ai_paper:
  enabled: false
  styles: [intraday_long]            # later: swing_long, intraday_short, swing_short
  limits_ceiling: {}
  experiment_kill_drawdown_pct: null # percent, e.g. 20; off by default
  experiment_kill_basis: start       # start | peak
  broker_outage_pause_seconds: 300   # pause the experiment after this long without broker data
  acceptance_probe: false            # paper only; true only on the SP1 acceptance day (Plan 6), then back to false
  model_budget_usd_per_day: 2000   # owner cap for model spend per New York day; only this file changes it (restart the trader)

# Massive.com (formerly Polygon.io)
massive_api_key: ''
massive_feed: stocks
massive_delayed: false

# TwelveData (parallel history backend; set TWELVEDATA_API_KEY env var as alternative)
twelvedata_api_key: ''

# Alpaca market data (free Basic plan with a paper account). Default history
# source for US stocks. Env vars ALPACA_API_KEY_ID / ALPACA_API_SECRET_KEY
# are used when these are empty.
alpaca_api_key_id: ''
alpaca_api_secret_key: ''

# CLI default for --source on commands that take it (history download,
# snapshot, watch, financials). Per-command --source still wins.
# Forex commands never inherit it (see data_providers.forex below).
# Override per-shell with MMR_DEFAULT_DATA_SOURCE.
# Recognised values: alpaca, massive, twelvedata, ib (only used where the choice
# set for that command includes it; otherwise the command's own default
# applies). It affects `data download`. `snapshot` / `snapshot-batch` default to
# data_providers.quotes, else MMR_DEFAULT_DATA_SOURCE if it names a quote source,
# else a default_data_source of twelvedata or ib, else IB. `alpaca` here does NOT
# switch snapshots (set data_providers.quotes: alpaca for that). REST sources
# cover US listings only; --exchange/--currency need IB.
# `movers` and `news` never inherit it: use data_providers.movers /
# data_providers.news below. `ideas` still defaults to massive until phase 3b.
default_data_source: alpaca

# Optional per-capability override. Wins over default_data_source.
# data_providers:
#   history: alpaca
#   quotes: alpaca    # snapshot default; unset = IB
#   movers: alpaca
#   news: alpaca
#   forex: frankfurter          # forex convert/snapshot-all; also snapshot/quote (unset = IB)
#   movers_forex: computed_fx
#   movers_indices: etf_proxy

# Equity-curve decimation at backtest-persist time. The full per-bar
# series is ~9.9 MB per 1-min run (4,713 runs took ~47 GB pre-fix);
# daily decimation drops this to ~17 KB with no statistical loss for
# PSR/Sharpe-CI (both n>=30, daily gives n=252). Override per-shell
# with MMR_EQUITY_DECIMATION.
#   daily     resample to last-value-per-day (recommended)
#   none      no decimation (legacy bloat)
#   <int>     uniform sample down to N points
equity_decimation: daily
