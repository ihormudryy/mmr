# Example spec for `mmr research evaluate`. Copy it and edit it. The evaluation
# records the strategy file by content hash and by the commit that last touched
# it, so the strategy file must be committed and clean. Keeping your spec in git
# is good practice, but the evaluation does not require it.
name: orb_us_large
strategy: strategies/opening_range_breakout.py   # must be inside strategies/
class: OpeningRangeBreakout
params: {RANGE_MINUTES: 45, VOLUME_MULT: 1.3}    # upper-case tunables of the class only
neighbourhood:            # adjacent values; neighbours change one key at a time
  RANGE_MINUTES: [30, 60]
  VOLUME_MULT: [1.2, 1.4]
# At least 8 distinct conids, all on one market with an XNYS calendar.
# AAPL, MSFT, NVDA, AMD, TSLA, AMZN, META, GOOGL. Verify each with `mmr resolve`.
conids: [265598, 272093, 4815747, 4391, 76792991, 3691937, 107113386, 208813719]
bar_size: 1 min           # 15 minutes or shorter: live paper automation flattens at 15:45 ET
period: {start: 2024-01-02, end: 2026-09-30}
walk_forward: {folds: 6, embargo_sessions: 5, holdout_sessions: 90}
sizing: {order_notional: 1900, account_equity: 100000}
max_gross_allocation: 0.05    # in (0, 1]
