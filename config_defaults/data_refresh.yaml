# TEMPLATE — copied to ~/.config/mmr/ on first run (container.ensure_config_dir,
# start_mmr.sh, docker-entrypoint.sh). Edits here do NOT affect a running
# system. The live config lives in ~/.config/mmr/ (bind-mounted into the
# container at /home/trader/.config/mmr/). Use this file to update defaults
# that ship with the repo for fresh installs only.
#
# Declarative refresh jobs: what data to keep current in the local DuckDB.
# Pycron owns the SCHEDULING (see pycron.yaml — `data_refresh_*` entries).
# This file owns WHAT to fetch.
#
# Run manually:
#   mmr data refresh <job_name> [<job_name> ...]   # one or more named jobs
#   mmr data refresh --all                          # everything below
#   mmr data status                                 # what's stale
#
# Fields per job:
#   universe   — name of a universe (mmr universe show <name>). Required
#                (use a synthetic universe via `mmr universe create ...`
#                + `mmr universe add ...` if you want an ad-hoc list).
#   source     — 'alpaca', 'twelvedata', 'massive', or 'ib'. Optional — when
#                omitted, US exchanges → 'alpaca' (free, SIP), all others → 'ib'.
#                An 'alpaca' job refuses (ALPACA_NON_US_INSTRUMENT) any entry whose
#                primary exchange is not a US listing; the job then reports failed.
#   bar_size   — "1 day", "1 min", etc. Same vocab as `mmr data download`.
#   days       — lookback window. Keep 1-min windows small (90d for US,
#                30d for ASX) — IB historical pacing is the bottleneck.
#   force      — bool, default false. When true, refetches the full
#                window every time (otherwise incremental: only missing
#                date ranges are fetched, so a daily cron is cheap).

jobs:
  # ---- US (Alpaca, free) — runs after US after-hours close (20:30 ET) ----
  # Alpaca SIP 1-min bars include pre- and post-market (04:00–20:00 ET). Only
  # completed sessions are fetched (see trader/data_providers/alpaca/sessions.py).
  us_top20_daily:
    universe: downloads          # the auto-registered universe from `mmr data download`
    source: alpaca
    bar_size: "1 day"
    days: 365

  us_top20_1min:
    universe: downloads
    source: alpaca
    bar_size: "1 min"
    days: 90

  # ---- AI research (Alpaca) — runs at 21:15 ET, after the US jobs ----
  # An SP2c evaluation reads `research_service.period_sessions` (690) sessions of
  # its bar size for every conid, plus 220 earlier daily SPY sessions (conid
  # 756733). The research service refuses a submit with BARS_MISSING (retryable)
  # until these bars are stored; it never evaluates on partial data.
  # Extended-hours bars stay stored; the evaluation reads regular sessions only.
  # `research` is a universe you create: the same conids as every
  # ai.yaml `research.universes` list, PLUS SPY. ai.yaml is not read here, so
  # keep both lists in step by hand (docs/OPERATIONAL_STATE.md, "Daily bars").
  # Keep one intraday job per entry of ai.yaml `research.bar_sizes`.
  # days: 690 sessions span up to ~1008 calendar days, 910 sessions (with SPY's
  # lookback) up to ~1330; raise both if you raise period_sessions.
  # tests/research/test_research_refresh_config.py checks these numbers.
  # The first run of research_1min fetches ~2.8 years of 1-min bars (with
  # extended hours) for every conid; run it once by hand before research.enabled.
  research_daily:
    universe: research
    source: alpaca
    bar_size: "1 day"
    days: 1360

  research_1min:
    universe: research
    source: alpaca
    bar_size: "1 min"
    days: 1030

  research_5mins:
    universe: research
    source: alpaca
    bar_size: "5 mins"
    days: 1030

  research_15mins:
    universe: research
    source: alpaca
    bar_size: "15 mins"
    days: 1030

  # ---- ASX (IB) — runs after ASX close (16:30 AEST / 16:30 ET prev day) ----
  # ASX has no after-hours session — once the 16:00 closing auction
  # settles, the day's bars are final. Run 30 min after to be safe.
  asx_daily:
    universe: asx
    source: ib
    bar_size: "1 day"
    days: 365

  asx_1min:
    universe: asx
    source: ib
    bar_size: "1 min"
    days: 30                     # IB historical pacing makes longer windows expensive
