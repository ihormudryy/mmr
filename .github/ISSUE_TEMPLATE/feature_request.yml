name: Feature request
description: Suggest a new feature or an improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended ideas or questions, start a [discussion](https://github.com/ihormudryy/mmr/discussions) instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Commands, config or UI you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Trading / orders / risk
        - Strategies / backtesting
        - Data providers
        - Dashboard
        - CLI / SDK / LLM workflow
        - Docker / deployment
        - Docs
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this myself.
