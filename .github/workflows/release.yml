name: Release image

# Publishes the shared MMR image (used by trader, strategy, data, dashboard
# and scheduler) to GitHub Container Registry when a release is published.
# Pull requests that touch the image only build it, they never push.

on:
  release:
    types: [published]
  # The release stage is manual: after merging to master, run this workflow
  # from the Actions tab (or `gh workflow run release.yml -f version=X.Y.Z`).
  # It tags the dispatched commit, creates the GitHub release from that
  # version's CHANGELOG section, and publishes the image in the same run
  # (a token-created release does not re-fire the `release` event).
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.1 (must have a CHANGELOG section); leave empty to only rebuild the image"
        required: false
        default: ""
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - .github/workflows/release.yml

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test-shard:
    # The same split as CI (scripts/ci_test_shard.py): every test file runs in exactly one shard.
    name: Test shard ${{ matrix.shard }}/8 (Python 3.12.13)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12.13
      - run: uv sync --python 3.12.13 --frozen --extra test
      - run: uv run --frozen pytest $(uv run --frozen python scripts/ci_test_shard.py ${{ matrix.shard }} 8) --timeout=30 --timeout-method=thread -q

  async-ibrx:
    name: Async IB reactive (quarantined)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12.13
      - run: uv sync --python 3.12.13 --frozen --extra test
      - run: uv run --frozen pytest tests/test_ibrx_async.py --timeout=30 -q

  test:
    # Keeps the old job name, so `needs: test` below still waits for every shard.
    name: Test suite (Python 3.12.13)
    needs: [test-shard, async-ibrx]
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test-shard.result }}" = success && test "${{ needs.async-ibrx.result }}" = success

  release:
    name: Create GitHub release
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: The project version must match
        run: |
          grep -q "^version = \"$VERSION\"" pyproject.toml \
            || { echo "pyproject.toml does not say version = \"$VERSION\""; exit 1; }
      - name: Release notes from the changelog
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
      - name: Create the tag and the release
        # gh creates the v$VERSION tag at the dispatched commit.
        run: gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}

  image:
    name: Build and push image
    # The release job is skipped on every event but a versioned dispatch;
    # a skipped need does not stop this job (only a failure does).
    needs: [test, release]
    # `needs` skips this job when `test` is skipped (pull requests), so
    # run it anyway unless the tests actually failed.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
            type=raw,value=latest,enable=${{ (github.event_name == 'release' && !github.event.release.prerelease) || (github.event_name == 'workflow_dispatch' && inputs.version != '') }}
            type=sha
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=MMR
            org.opencontainers.image.description=LLM-native algorithmic trading platform for Interactive Brokers

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
