# AI paper bot (SP2a/b): models, prices and limits. Read only by the `ai` container.
# Credentials are NOT here. They come from the environment of the `ai` container:
#   openrouter: OPENROUTER_API_KEY
#   bedrock:    AWS_REGION + the standard AWS chain (keys or AWS_PROFILE)
#   azure:      AZURE_OPENAI_ENDPOINT, AZURE_OPENAI_API_KEY, AZURE_OPENAI_API_VERSION
#
# There are no default model ids. An empty `model` stops the service at startup.
# The owner picks them. Example ids (not defaults): "anthropic/claude-sonnet-4.5" on
# openrouter, an inference-profile id on bedrock, a deployment name on azure.
# Model ids per role. Fill them in before starting the ai service; a blank id stops it at start.
# Jev runs on openrouter only. Examples (check the provider's current list, they change):
#   jev:          {backend: openrouter, model: "anthropic/claude-sonnet-4.5"}
#   orchestrator: {backend: openrouter, model: "openai/gpt-5"}   # or bedrock / azure (deployment name)
# Every model needs a price under pricing:, or its calls are refused (no reservation, no call).
roles:
  orchestrator:
    backend: openrouter        # openrouter | bedrock | azure
    model: ""
    max_input_tokens: 60000
    max_output_tokens: 4000
    call_timeout_seconds: 45
  jev:
    backend: openrouter        # Jev must stay on openrouter
    model: ""
    max_input_tokens: 60000
    max_output_tokens: 4000
    call_timeout_seconds: 45

# USD per million tokens, per backend and model id. A model with no row here is
# refused at call time (nothing is reserved).
pricing:
  openrouter: {}
  bedrock: {}
  azure: {}
  # openrouter:
  #   "vendor/model-id": {input_usd_per_million: 3.0, output_usd_per_million: 15.0}

# The daily model cap is not set here. It is ai_paper.model_budget_usd_per_day in
# trader.yaml (default 2000); the ai service reads it from the trader. A raise
# applies at the next 00:00 America/New_York, a lower cap at once.
budget:
  calls_per_hour: 120
  max_in_flight: 2                 # 2 is the maximum
  decision_deadline_seconds: 60    # one deadline spans orchestrator plus Jev

database_path: ~/.local/share/mmr_ai/ai.duckdb

# The controller runtime (SP2 Plan 5). Every key is optional; these are the defaults.
# The trader host comes from the TRADER_TYPED_ADDRESS environment variable (tcp://trader in Docker).
controller:
  trader_query_port: 42101
  trader_command_port: 42102
  rpc_timeout_seconds: 10.0
  lease_seconds: 60
  renew_seconds: 20
  held_retry_seconds: 5.0
  entry_slot_minutes: 15
  position_slot_minutes: 15
  slot_start_grace_seconds: 120
  signal_poll_seconds: 5.0
  signal_page_limit: 100
  signal_max_age_seconds: 300           # counted from the signal's bar close (signal_time + bar size)
  decision_ttl_seconds: 300
  not_found_settle_seconds: 120
  reconcile_seconds: 10.0
  outbox_seconds: 5.0
  experiment_poll_seconds: 10.0
  heartbeat_seconds: 10.0
  budget_cap_poll_seconds: 60.0   # how often the owner's cap is read from the trader (trader.yaml)
  research_query_port: 42106
  research_command_port: 42107
  heartbeat_path: /tmp/mmr_ai_heartbeat.json

# The decision engine (SP2 Plan 6). Every key is optional; these are the defaults.
decisions:
  # The discretionary deployment the operator registered (mmr ai-deployment register-discretionary).
  # null: no entry cycles (self-found ideas) run.
  discretionary_deployment_digest: null
  # Unused since SP2c Plan 2: only aidv- instances of ACTIVE judged versions are judged (bracket
  # ai_deployments below). A BUY of any other strategy is noted STRATEGY_NOT_BOUND, with no model call.
  strategies: {}
  ai_deployments: {stop_fraction: 0.02, target_fraction: 0.04}
  self_found_bracket: {stop_fraction: 0.02, target_fraction: 0.04}
  fixed_rule: {version: fixed_rule.v1, stop_fraction: 0.02, target_fraction: 0.04}   # v1 is pinned to these values
  discovery:
    movers_top: 10
    most_actives_top: 10
    watchlist: []                  # optional owner symbols, e.g. [AAPL, MSFT]
    news_per_symbol: 2
    news_symbols_max: 10
    max_candidates_to_model: 15
  max_entries_per_cycle: 2
  quote_max_age_seconds: 15
  news_chars_per_item: 400
  role_recheck_seconds: 300        # a role whose provider rejects its model is paused this long

# SP2c research cycle (a menu only; trader.yaml ai_paper.backtest_judge is the authority).
# This container cannot read trader.yaml. It cuts every cohort at max_cohort_points here, so the operator must keep
# max_cohort_points at or below ai_paper.backtest_judge.max_cohort_points in trader.yaml.
research:
  enabled: false
  strategy_keys: []          # e.g. ["strategies/opening_range_breakout.py:OpeningRangeBreakout"]
  universes: {}              # e.g. {us_large: [265598, 272093, ...]}  (8-20 conids, check with mmr resolve)
  bar_sizes: ["1 min", "5 mins", "15 mins"]   # nothing longer than 15 mins
  max_candidates_per_cycle: 3
  max_cohort_points: 3
  after_close_minutes: 30
  poll_seconds: 30
  evaluation_stale_hours: 24
  judge_attempts: 2
