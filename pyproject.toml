[project]
name = "mmr"
version = "0.1.0"
description = "LLM-native algorithmic trading platform for Interactive Brokers"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "9600 Developments" },
    { name = "Ihor Mudryy" },
]
keywords = [
    "algorithmic-trading", "interactive-brokers", "trading", "backtesting",
    "quantitative-finance", "duckdb", "zeromq", "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "backoff>=2.2",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "markdown>=3.11",
    "pymdown-extensions>=12.1",
    "nh3>=0.3.7",
    "beautifulsoup4>=4.15.0",
    "click>=8.5.0",
    "coloredlogs>=15.0",
    "crontab>=1.0",
    "dateparser>=1.4.3",
    "dill>=0.4",
    "duckdb>=1.5.6",
    "durations>=0.3",
    "eventkit>=1.0.0",
    "exchange-calendars>=4.13.2",
    "expression>=5.7.0",
    "ib_async>=2.1",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "msgpack>=1.2.3",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotext>=6.1.0",
    "plotille>=6.0",
    "plotly>=7.1.0",
    "prompt-toolkit>=3.0.53",
    "psutil>=7.2",
    "pyarrow>=25.0.1",
    "python-dateutil>=2.9",
    "pypager>=3.0",
    "pytz>=2026.4",
    "pyyaml>=6.0",
    "pyzmq>=27.2.0",
    "reactivex>=5.1.0",
    "requests>=2.34.2",
    "httpx>=0.27",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tornado>=6.5.10",
    "uniplot>=0.23.2",
    "vectorbt>=1.1.1",
    "massive>=2.8.0",
    "twelvedata[pandas]>=1.4.0",
    "sse-starlette==3.5.0",
    "cryptography>=50.0.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.3.1",
    "isort>=9.0.2",
]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.16.0",
    "pytest-timeout>=2.3",
    "hypothesis>=6.168.3",
]
streaming = [
    "websocket-client>=1.9.2",
]
browser-test = [
    "playwright==1.63.0",
]

[project.urls]
Homepage = "https://github.com/ihormudryy/mmr"
Documentation = "https://github.com/ihormudryy/mmr#readme"
Issues = "https://github.com/ihormudryy/mmr/issues"
Changelog = "https://github.com/ihormudryy/mmr/blob/master/CHANGELOG.md"

[project.scripts]
trader-service = "trader.trader_service:main"
strategy-service = "trader.strategy_service:main"
data-service = "trader.data_service:main"
mmr = "trader.mmr_cli:main"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trader*", "web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# ``tests/__init__.py`` makes ``tests`` a real package (needed for
# ``from tests.paper_e2e…``). That stops pytest from putting ``tests/`` on
# ``sys.path``, which broke legacy bare imports (``from cc_fakes import…``,
# ``from conftest import…``). Keep both import styles working.
pythonpath = ["tests"]
# Keep ordinary `pytest tests/` runs off the live paper suite. Explicit
# `-m paper_e2e` (scripts/paper_e2e.sh) overrides this deselect.
addopts = ["-m", "not paper_e2e"]
markers = [
    "paper_e2e: live paper Docker stack (skip if down)",
    "paper_e2e_live_orders: places/arms real paper risk; needs MMR_PAPER_E2E_LIVE_ORDERS=1",
    "paper_e2e_restart: restarts trader container; needs MMR_PAPER_E2E_RESTART=1",
    "live: calls real provider APIs; needs MMR_LIVE_TESTS=1 and keys",
]
# Default per-test budget so a leaked ZMQ Context.term() (or similar C-level
# block) fails the test instead of wedging the whole suite forever.
# ``thread`` (not ``signal``): SIGALRM cannot interrupt C-level waits or
# Starlette TestClient portal ``thread.join()`` after an abandoned manage RPC,
# which is what made CI jobs hang until the runner killed them (~4:30).
timeout = 30
timeout_method = "thread"

[tool.isort]
multi_line_output = 3
force_alphabetical_sort = true
from_first = false
line_length = 110
lines_after_imports = 2
